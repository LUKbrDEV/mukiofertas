name: Coletar, importar e postar ofertas

on:
  schedule:
    # minutos "quebrados": no minuto 0 o GitHub atrasa (ou pula) muitas execuções agendadas
    - cron: "11,41 * * * *"
  # Também pode ser acionado pelo painel admin (aba Saúde do robô) ou pelo GitHub
  workflow_dispatch:
    inputs:
      tarefa:
        description: "O que rodar"
        type: choice
        default: tudo
        options:
          - tudo
          - coletar
          - conferir-precos
          - postar-telegram
          - kabum
          - postar-whatsapp

concurrency:
  group: coleta
  cancel-in-progress: false

jobs:
  rodar:
    runs-on: ubuntu-latest
    timeout-minutes: 30 # o catálogo completo da KaBuM! pode demorar alguns minutos para baixar
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Lomadee + Shopee + AliExpress + Awin (KaBuM!) + expirar por preço + renovar + apagar as expiradas antigas
      - name: Coletar ofertas (Lomadee, Shopee, AliExpress, KaBuM! e cupons)
        if: ${{ !inputs.tarefa || inputs.tarefa == 'tudo' || inputs.tarefa == 'coletar' }}
        run: node scripts/coletar.mjs
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LOMADEE_API_KEY: ${{ secrets.LOMADEE_API_KEY }}
          LOMADEE_CANAL: ${{ secrets.LOMADEE_CANAL }}
          SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_SECRET: ${{ secrets.SHOPEE_SECRET }}
          ALIEXPRESS_APP_KEY: ${{ secrets.ALIEXPRESS_APP_KEY }}
          ALIEXPRESS_APP_SECRET: ${{ secrets.ALIEXPRESS_APP_SECRET }}
          ALIEXPRESS_TRACKING_ID: ${{ secrets.ALIEXPRESS_TRACKING_ID }}
          AWIN_FEED_KABUM: ${{ secrets.AWIN_FEED_KABUM }}
          # cupons da Awin (opcional)
          AWIN_API_TOKEN: ${{ secrets.AWIN_API_TOKEN }}
          AWIN_PUBLISHER_ID: ${{ secrets.AWIN_PUBLISHER_ID }}

      # Só a KaBuM! (botão do painel admin): baixa o catálogo da Awin na hora, sem esperar o horário
      - name: Buscar ofertas da KaBuM! (agora)
        if: ${{ inputs.tarefa == 'kabum' }}
        run: node scripts/coletar.mjs --so=awin --forcar
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          AWIN_FEED_KABUM: ${{ secrets.AWIN_FEED_KABUM }}

      # Confere o preço das ofertas do Telegram (fora Amazon), de 5 em 5 horas cada uma
      - name: Conferir preços (ofertas do Telegram)
        if: ${{ always() && (!inputs.tarefa || inputs.tarefa == 'tudo' || inputs.tarefa == 'conferir-precos') }}
        continue-on-error: true
        run: node scripts/conferir-precos.mjs
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Shopee e AliExpress são conferidas pela API de afiliados
          SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_SECRET: ${{ secrets.SHOPEE_SECRET }}
          ALIEXPRESS_APP_KEY: ${{ secrets.ALIEXPRESS_APP_KEY }}
          ALIEXPRESS_APP_SECRET: ${{ secrets.ALIEXPRESS_APP_SECRET }}
          ALIEXPRESS_TRACKING_ID: ${{ secrets.ALIEXPRESS_TRACKING_ID }}

      # A importação do canal do Telegram é feita na hora pelo webhook do site
      # (app/api/telegram-webhook), por isso não tem passo aqui.

      - name: Postar no Telegram
        if: ${{ always() && (!inputs.tarefa || inputs.tarefa == 'tudo' || inputs.tarefa == 'postar-telegram') }}
        run: node scripts/postar-telegram.mjs
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SITE_URL: ${{ secrets.SITE_URL }}

      # O envio automático para o WhatsApp tem o próprio robô (whatsapp.yml, a cada 15 min),
      # para não esperar a coleta terminar. Aqui ele só roda pelos botões do painel.
      - name: Postar no WhatsApp
        if: ${{ always() && (inputs.tarefa == 'tudo' || inputs.tarefa == 'postar-whatsapp') }}
        continue-on-error: true
        run: node scripts/postar-whatsapp.mjs
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EVOLUTION_URL: ${{ secrets.EVOLUTION_URL }}
          EVOLUTION_API_KEY: ${{ secrets.EVOLUTION_API_KEY }}
          EVOLUTION_INSTANCIA: ${{ secrets.EVOLUTION_INSTANCIA }}
          SITE_URL: ${{ secrets.SITE_URL }}
          # frase engraçada da IA (opcional)
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
